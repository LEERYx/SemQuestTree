<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>问义树 · SemQuestTree</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0e1116; color: #d7dde6;
    font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 18px;
    padding: 13px 20px; border-bottom: 1px solid #232a36; background: #12161d; flex-shrink: 0;
  }
  .title { font-size: 17px; font-weight: 700; letter-spacing: 1px; }
  .title .en { color: #5eead4; font-weight: 500; font-size: 13px; margin-left: 6px;
    font-family: ui-monospace, Menlo, monospace; }
  .tbl-name { font-size: 15px; font-weight: 700; color: #f2d38b;
    font-family: ui-monospace, Menlo, monospace; }
  .stats { color: #8b95a5; font-size: 12.5px; }
  main { flex: 1; display: flex; min-height: 0; }
  #treePanel { width: 46%; min-width: 400px; border-right: 1px solid #232a36;
    overflow: auto; padding: 14px 12px 30px; }
  #detailPanel { flex: 1; overflow: auto; padding: 18px 24px 40px; }
  .panel-head { font-size: 12px; color: #8b95a5; padding: 0 8px 10px;
    display: flex; justify-content: space-between; align-items: center; }
  .panel-head .hint { color: #5b6472; }
  .btn { background: #1a212c; border: 1px solid #2c3648; color: #9aa4b2;
    border-radius: 6px; padding: 3px 12px; font-size: 12px; cursor: pointer; }
  .btn:hover { color: #d7dde6; border-color: #3a4658; }
  .btn.primary { background: #173229; border-color: #245743; color: #5eead4; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 7px;
    padding: 5px 10px; border-radius: 7px; margin-bottom: 1px; }
  .row:hover { background: #1a212c; }
  .row.clickable { cursor: pointer; }
  .row.selected { background: #1d2a3a; outline: 1px solid #2c4a63; }
  .chev { width: 13px; flex-shrink: 0; color: #5eead4; font-size: 11px; }
  .icon { font-size: 10px; color: #4d586a; width: 13px; flex-shrink: 0; }
  .internal > .row > .icon { color: #5eead4; }
  .leaf .icon { color: #e8b64c; }
  .leaf.zero .icon { color: #4d586a; }
  .name { font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: #c9d2de; }
  .leaf .name { color: #f2d38b; }
  .tag { font-size: 10px; padding: 0 6px; border-radius: 99px; background: #3a2d1a;
    color: #e8b64c; border: 1px solid #57431f; }
  .badge { font-size: 11px; min-width: 20px; text-align: center; padding: 0 6px;
    border-radius: 99px; background: #173229; color: #5eead4;
    border: 1px solid #245743; font-family: ui-monospace, Menlo, monospace; }
  .badge.zero { background: transparent; color: #4d586a; border-color: #2a323f; }
  .crit { flex-basis: 100%; font-size: 11.5px; color: #7c8698; padding-left: 33px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { color: #5b6472; text-align: center; margin-top: 32vh; font-size: 14px; line-height: 2.1; }
  .empty span { font-size: 12px; color: #454e5c; }
  .loading, .error { color: #8b95a5; margin-top: 20px; }
  .error { color: #ef7d7d; }
  .d-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .d-name { font-family: ui-monospace, Menlo, monospace; font-size: 18px;
    color: #f2d38b; font-weight: 700; }
  .d-count { margin-left: auto; font-size: 12px; color: #5eead4; }
  .crumbs { font-size: 12px; color: #8b95a5; margin-bottom: 14px; }
  .crumb { font-family: ui-monospace, Menlo, monospace; }
  .sep { margin: 0 7px; color: #454e5c; }
  .d-crit { background: #12161d; border: 1px solid #232a36; border-radius: 8px;
    padding: 10px 14px; font-size: 12.5px; color: #9aa4b2; margin-bottom: 18px; }
  .d-crit div + div { margin-top: 4px; }
  .d-sub { font-size: 12px; letter-spacing: 2px; color: #8b95a5; margin-bottom: 10px; }
  .d-none { color: #5b6472; font-size: 13px; }
  .doc { background: #12161d; border: 1px solid #232a36; border-radius: 10px;
    padding: 12px 14px; margin-bottom: 10px; }
  .doc:hover { border-color: #354052; }
  .doc-id { display: inline-block; font-family: ui-monospace, Menlo, monospace;
    font-size: 11.5px; color: #5eead4; background: #12241f;
    border: 1px solid #245743; border-radius: 5px; padding: 0 7px; margin-bottom: 7px; }
  .doc-content { font-size: 13.5px; color: #c9d2de; }
  .doc-via { margin-top: 7px; font-size: 11.5px; color: #5b6472; }
  .d-more { text-align: center; padding: 8px 0; font-size: 12.5px; color: #5eead4;
    cursor: pointer; border: 1px dashed #245743; border-radius: 8px; }
  .d-more:hover { border-color: #35a08a; background: #101a18; }
  .menu { position: fixed; background: #161b24; border: 1px solid #2c3648;
    border-radius: 8px; padding: 4px; z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .menu div { padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .menu div:hover { background: #1d2a3a; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center; z-index: 60; }
  .dialog { background: #12161d; border: 1px solid #2c3648; border-radius: 12px;
    padding: 20px 22px; width: 500px; }
  .dialog h3 { font-size: 15px; color: #d7dde6; margin-bottom: 4px; }
  .dialog h3 code { color: #5eead4; font-size: 14px; }
  .dlg-note { font-size: 12px; color: #8b95a5; margin-bottom: 8px; line-height: 1.7; }
  .dialog label { display: block; font-size: 12px; color: #8b95a5; margin: 10px 0 4px; }
  .dialog input { width: 100%; background: #0e1116; border: 1px solid #2a323f;
    border-radius: 6px; color: #d7dde6; padding: 7px 10px; font-size: 13px;
    font-family: ui-monospace, Menlo, monospace; }
  .dialog input:focus { outline: none; border-color: #245743; }
  .dialog .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  .dialog .actions button { padding: 6px 18px; font-size: 13px; }
  .toast { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
    background: #12241f; border: 1px solid #245743; color: #5eead4;
    padding: 10px 18px; border-radius: 10px; font-size: 13px; z-index: 70;
    max-width: 80vw; }
  .toast.err { background: #2a1414; border-color: #5c2323; color: #ef7d7d; }
  .ctl { display: flex; align-items: center; gap: 6px; }
  .ctl select, .ctl input {
    background: #0e1116; border: 1px solid #2a323f; border-radius: 6px;
    color: #d7dde6; padding: 4px 8px; font-size: 12px;
    font-family: ui-monospace, Menlo, monospace;
  }
  .ctl select { max-width: 230px; }
  .ctl input { width: 110px; }
  .ctl select:focus, .ctl input:focus { outline: none; border-color: #245743; }
  .tabs { display: flex; gap: 6px; padding: 0 8px 12px; }
  .tab { background: transparent; border: 1px solid #2a323f; color: #8b95a5;
    border-radius: 6px; padding: 3px 14px; font-size: 12.5px; cursor: pointer; }
  .tab.active { background: #173229; border-color: #245743; color: #5eead4; }
  .q-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .q-row input { flex: 1; background: #0e1116; border: 1px solid #2a323f; border-radius: 7px;
    color: #d7dde6; padding: 8px 12px; font-size: 13px; }
  .q-row input:focus { outline: none; border-color: #245743; }
  .q-row textarea { flex: 1; background: #0e1116; border: 1px solid #2a323f; border-radius: 7px;
    color: #d7dde6; padding: 8px 12px; font-size: 13px; resize: vertical; min-height: 66px;
    font-family: inherit; line-height: 1.55; }
  .q-row textarea:focus { outline: none; border-color: #245743; }
  .q-modes { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .q-modes .hint-dim { color: #5b6472; font-size: 11.5px; margin-left: 8px; }
  #q-submodes { margin-bottom: 8px; }
  #q-submodes .tab { padding: 2px 10px; font-size: 11.5px; }
  .q-sub { font-size: 12px; letter-spacing: 2px; color: #8b95a5; margin: 16px 0 8px; }
  .chip { display: inline-block; font-family: ui-monospace, Menlo, monospace; font-size: 11.5px;
    color: #f2d38b; background: #241d10; border: 1px solid #57431f; border-radius: 99px;
    padding: 1px 10px; margin: 0 6px 6px 0; }
  .fast-badge { display: inline-block; font-size: 11px; color: #5eead4;
    background: #173229; border: 1px solid #245743; border-radius: 99px;
    padding: 1px 10px; margin-left: 8px; letter-spacing: 0; }
  .q-rank { background: #12161d; border: 1px solid #232a36; border-radius: 10px;
    padding: 11px 14px; margin-bottom: 8px; display: flex; gap: 12px; align-items: flex-start; }
  .q-score { font-family: ui-monospace, Menlo, monospace; font-size: 15px; font-weight: 700;
    color: #5eead4; background: #12241f; border: 1px solid #245743; border-radius: 8px;
    min-width: 34px; text-align: center; padding: 2px 6px; flex-shrink: 0; }
  .q-meta { font-size: 11px; color: #8b95a5; margin-top: 5px;
    font-family: ui-monospace, Menlo, monospace; }
  .q-step { font-size: 12px; color: #8b95a5; font-family: ui-monospace, Menlo, monospace;
    padding: 3px 0; border-bottom: 1px dashed #1d2430; }
  .q-step b { color: #5eead4; font-weight: 600; }
  .dim { color: #5b6472; }
  details.judge { margin-top: 14px; }
  details.judge summary { cursor: pointer; font-size: 12px; color: #8b95a5; }
  .q-none { color: #5b6472; font-size: 13px; }
  .hstats { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .gate-lb { font-size: 12px; color: #8b95a5; display: flex; align-items: center; gap: 5px; }
  .gate-lb input { width: 66px; background: #0e1116; border: 1px solid #2a323f;
    border-radius: 6px; color: #5eead4; padding: 3px 6px; font-size: 12px; text-align: center;
    font-family: ui-monospace, Menlo, monospace; }
  .gate-lb input:focus { outline: none; border-color: #245743; }
  .btn.danger { background: #2a1414; border-color: #5c2323; color: #ef7d7d; }
  .btn.danger:hover { border-color: #7c3030; color: #ff9b9b; }

  /* ── 开始页（全部表）────────────────────────────────────────── */
  #startView { flex: 1; overflow: auto; padding: 22px 28px 60px; }
  .start-sub { font-size: 12px; letter-spacing: 2px; color: #8b95a5; margin-bottom: 14px; }
  .newtbl { background: #12161d; border: 1px solid #232a36; border-radius: 12px;
    padding: 16px 18px; margin-bottom: 24px; }
  .newtbl-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .newtbl input { background: #0e1116; border: 1px solid #2a323f; border-radius: 6px;
    color: #d7dde6; padding: 7px 10px; font-size: 13px; }
  .newtbl input:focus { outline: none; border-color: #245743; }
  #nt-name { width: 230px; font-family: ui-monospace, Menlo, monospace; }
  #nt-note { flex: 1; min-width: 200px; }
  .mode-pick { display: flex; gap: 26px; margin: 12px 0 2px; }
  .mode-opt { display: flex; align-items: center; gap: 6px; font-size: 13px;
    color: #c9d2de; cursor: pointer; }
  .mode-opt input { accent-color: #5eead4; width: auto; }
  .mode-desc { font-size: 11.5px; color: #5b6472; margin-top: 7px; line-height: 1.7; }
  .tip { display: inline-flex; width: 16px; height: 16px; border-radius: 50%;
    border: 1px solid #2c3648; color: #8b95a5; font-size: 10.5px;
    align-items: center; justify-content: center; cursor: help; position: relative; flex-shrink: 0; }
  .tip:hover { color: #5eead4; border-color: #245743; }
  .tip .tipbox { display: none; }
  .tip:hover .tipbox { display: block; position: absolute; bottom: 24px; left: 50%;
    transform: translateX(-50%); width: 300px; background: #161b24;
    border: 1px solid #2c3648; border-radius: 8px; padding: 9px 12px; color: #c9d2de;
    font-size: 11.5px; line-height: 1.75; z-index: 80; text-align: left;
    box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 12px; }
  .card { background: #12161d; border: 1px solid #232a36; border-radius: 12px;
    padding: 14px 16px; cursor: pointer; transition: border-color .15s, background .15s; }
  .card:hover { border-color: #2c4a63; background: #141a23; }
  .card-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .card-name { font-size: 15px; font-weight: 700; color: #c9d2de;
    font-family: ui-monospace, Menlo, monospace; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .mode-tag { font-size: 10px; padding: 0 7px; border-radius: 99px;
    border: 1px solid; flex-shrink: 0; }
  .mode-tag.noul { color: #5eead4; border-color: #245743; background: #173229; }
  .mode-tag.choice { color: #e8b64c; border-color: #57431f; background: #3a2d1a; }
  .card-note { font-size: 12px; color: #8b95a5; margin-top: 7px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-foot { display: flex; align-items: center; gap: 10px; margin-top: 10px;
    font-size: 11.5px; color: #5b6472; font-family: ui-monospace, Menlo, monospace; }
  .card-edit, .card-del { margin-left: auto; background: transparent; border: none; color: #5b6472;
    cursor: pointer; font-size: 12px; padding: 2px 6px; border-radius: 5px;
    font-family: inherit; }
  .card-del { margin-left: 0; }
  .card-edit:hover { color: #5eead4; background: #12241f; }
  .card-del:hover { color: #ef7d7d; background: #2a1414; }
  .start-empty { color: #5b6472; text-align: center; margin-top: 12vh;
    font-size: 14px; line-height: 2.1; }
  .start-empty span { font-size: 12px; color: #454e5c; }
</style>
</head>
<body>
<header>
  <button class="btn" id="backBtn" style="display:none" data-i18n="back.allTables">‹ 全部表</button>
  <div class="title">问义树<span class="en">SemQuestTree</span></div>
  <span class="tbl-name" id="tblName" style="display:none"></span>
  <span class="mode-tag" id="tblMode" style="display:none"></span>
  <button class="btn" id="tblEdit" style="display:none" data-i18n-title="hdr.editTable">✎</button>
  <div class="ctl">
    <select id="provider" data-i18n-title="hdr.providerTitle">
      <option value="jev">jev</option>
      <option value="openrouter">openrouter</option>
      <option value="bailian">百炼</option>
      <option value="mock">mock</option>
    </select>
    <input id="modelFilter" data-i18n-ph="hdr.modelFilterPh" placeholder="筛模型…">
    <select id="model" data-i18n-title="hdr.modelTitle"></select>
  </div>
  <div class="hstats">
    <span id="stats"></span>
    <label class="gate-lb" id="gateLb" style="display:none" title="">
      <span id="gateLbTxt">门控</span>
      <input id="gate" type="number" min="0.05" max="1" step="0.05" value="0.7">
    </label>
    <button class="btn" id="langBtn" data-i18n-title="lang.title">EN</button>
  </div>
</header>
<main>
  <section id="startView" style="display:none">
    <div class="start-sub" data-i18n="start.sub">全部表 · 一张表是一棵判据树</div>
    <div class="newtbl">
      <div class="newtbl-row">
        <input id="nt-name" data-i18n-ph="nt.namePh" placeholder="表名（必填）">
        <input id="nt-note" data-i18n-ph="nt.notePh" placeholder="备注（可选，显示在卡片上）">
        <button class="btn primary" id="nt-go" data-i18n="nt.go">新建表</button>
      </div>
      <div class="mode-pick">
        <label class="mode-opt">
          <input type="radio" name="nt-mode" value="noul" checked> <span data-i18n="mode.noul">noul 多选分支</span>
          <span class="tip">?<span class="tipbox" data-i18n-html="tip.noulBody"><b>noul · 多选分支 + 并发搜索</b><br>
            每层把内容与各分支判据逐一比对（P(yes) 过门控），一份内容可同时命中多个分支；
            检索时多路并发命中、按命中叶数排序。适合一条话术涉及多种诉求的场景。</span></span>
        </label>
        <label class="mode-opt">
          <input type="radio" name="nt-mode" value="choice"> <span data-i18n="mode.choice">choice 单选分支</span>
          <span class="tip">?<span class="tipbox" data-i18n-html="tip.choiceBody"><b>choice · 单选逐层下行</b><br>
            每层一个问题，从全部选项（含兜底「以上都不符合」）中只挑一个胜出，沿单路径逐层下行；
            胜出置信度低于采纳线（默认 0.6）落兜底。适合互斥分类场景。</span></span>
        </label>
      </div>
      <div class="mode-desc" id="nt-mode-desc"></div>
    </div>
    <div id="tableGrid" class="grid"></div>
    <div id="startEmpty" class="start-empty" style="display:none" data-i18n-html="start.empty">
      还没有表<br>
      <span>用上方表单新建一张：命名 + 选分支方式（noul 多选 / choice 单选）</span>
    </div>
  </section>
  <section id="treePanel" style="display:none">
    <div class="panel-head">
      <span class="hint" data-i18n="tree.hint">左键点节点看详情（内部节点同时展开/收起） · 右键加 / 改 / 删节点</span>
      <button class="btn" id="expandAll" data-i18n="tree.expandAll">全部展开</button>
    </div>
    <div id="tree"><div class="loading" data-i18n="tree.loading">加载中…</div></div>
  </section>
  <section id="detailPanel" style="display:none">
    <div class="tabs">
      <button class="tab active" data-tab="detail" data-i18n="tab.detail">节点详情</button>
      <button class="tab" data-tab="quest" data-i18n="tab.quest">控制台</button>
    </div>
    <div id="tab-detail">
      <div id="detailEmpty" class="empty" data-i18n-html="detail.empty">点击左侧任意节点<br>展示该节点的路径、判据与落位数据（内部节点含子节点列表）<br><span>未点击不显示任何内容</span></div>
      <div id="detail" style="display:none"></div>
    </div>
    <div id="tab-quest" style="display:none">
      <div class="q-modes" id="q-mainmodes">
        <button class="tab active" data-mode="add" data-i18n="q.modeAdd">落位 add</button>
        <button class="tab" data-mode="search" data-i18n="q.modeSearch">检索 search</button>
        <span class="hint-dim" id="q-hint"></span>
      </div>
      <div class="q-modes" id="q-submodes" style="display:none">
        <button class="tab active" data-sub="single" data-i18n="q.subSingle">单条</button>
        <button class="tab" data-sub="batch" data-i18n="q.subBatch">批量</button>
      </div>
      <div class="q-row" id="q-id-row" style="display:none">
        <input id="q-doc-id" data-i18n-ph="q.docIdPh" placeholder="文档 ID（留空自动生成；同 ID 重落会替换旧落位）">
      </div>
      <div class="q-row">
        <textarea id="q-input" rows="3"></textarea>
        <button class="btn primary" id="q-go"></button>
      </div>
      <div id="q-out"></div>
    </div>
  </section>
</main>
<script>
  // ── 双语（zh/en）：localStorage('sq-lang') 持久化，右上角按钮切换 ──
  const I18N = {
    zh: {
      'app.docTitle': '问义树 · SemQuestTree',
      'app.titleShort': '问义树',
      'back.allTables': '‹ 全部表',
      'hdr.editTable': '修改表名 / 备注',
      'hdr.providerTitle': '决策后端',
      'hdr.modelTitle': '决策模型',
      'hdr.modelFilterPh': '筛模型…',
      'hdr.docs': '落位 {n} 条',
      'lang.title': '切换语言 / Switch language',
      'gate.noul': '门控', 'gate.choice': '采纳线',
      'gate.noulTitle': 'noul 绝对门控 (0, 1]，只影响其后的判定',
      'gate.choiceTitle': 'choice 采纳线 (0, 1]：单层胜出置信度低于此值落兜底',
      'start.sub': '全部表 · 一张表是一棵判据树',
      'nt.namePh': '表名（必填）', 'nt.notePh': '备注（可选，显示在卡片上）', 'nt.go': '新建表',
      'mode.noul': 'noul 多选分支', 'mode.choice': 'choice 单选分支',

  async function api(path) {

    const r = await fetch(path, {
      method: method,
      headers: body != null ? { 'Content-Type': 'application/json' } : undefined,
      body: body != null ? JSON.stringify(body) : undefined
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    return d;
  }

  /** 对话框骨架：挂遮罩、点遮罩关闭，返回 overlay 元素（内部控件由调用方接线）。 */
  function openOverlay(html) {
    const ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = html;
    document.body.appendChild(ov);
    ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
    return ov;
  }

  // ── hash 路由：#/ 开始页 · #/t/<id> 表内视图 ────────────────────

  function route() {
    const m = (location.hash || '#/').match(/^#\/t\/([^/]+)$/);
    if (m) openTable(decodeURIComponent(m[1]));
    else showStart();
  }
  window.addEventListener('hashchange', route);

  function showStart() {
    state.tid = null;
    state.tinfo = null;
    $('#backBtn').style.display = 'none';
    $('#tblName').style.display = 'none';
    $('#tblMode').style.display = 'none';
    $('#tblEdit').style.display = 'none';
    $('#gateLb').style.display = 'none';
    $('#stats').textContent = '';
    $('#startView').style.display = '';
    $('#treePanel').style.display = 'none';
    $('#detailPanel').style.display = 'none';
    document.title = T('app.docTitle');
    loadTables();
  }

  async function loadTables() {
    try {
      renderTables(await api('/api/tables'));
    } catch (e) {
      $('#tableGrid').innerHTML = '<div class="error">' + T('toast.loadFail') + ': ' + esc(e) + '</div>';
    }
  }

  function renderTables(list) {
    const grid = $('#tableGrid');
    $('#startEmpty').style.display = list.length ? 'none' : '';
    grid.innerHTML = '';
    for (const t of list) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML =
        '<div class="card-head"><span class="card-name">' + esc(t.name) + '</span>' +
        '<span class="mode-tag ' + esc(t.mode) + '">' + esc(T(t.mode === 'choice' ? 'tag.choice' : 'tag.noul')) + '</span></div>' +
        '<div class="card-note">' + (t.note ? esc(t.note) : '<span style="color:#454e5c">' + esc(T('card.noNote')) + '</span>') + '</div>' +
        '<div class="card-foot"><span>' + esc(Tf('card.docs', { n: t.docCount })) + '</span>' +
        '<span>' + (t.createdAt ? new Date(t.createdAt).toLocaleDateString(localeTag()) : '') + '</span>' +
        '<button class="card-edit">' + esc(T('card.edit')) + '</button>' +
        '<button class="card-del">' + esc(T('card.del')) + '</button></div>';
      card.onclick = () => { location.hash = '#/t/' + encodeURIComponent(t.id); };
      card.querySelector('.card-edit').onclick = e => { e.stopPropagation(); openTableEditDialog(t, () => loadTables()); };
      card.querySelector('.card-del').onclick = e => { e.stopPropagation(); confirmDeleteTable(t); };
      grid.appendChild(card);
    }
  }

  // 修改表名/备注（开始页卡片与表内头部共用）；onSaved 收到最新表元信息
  function openTableEditDialog(t, onSaved) {
    const ov = openOverlay(
      '<div class="dialog">' +
      '  <h3>' + esc(Tf('tbl.editTitle', { name: t.name })) + '</h3>' +
      '  <div class="dlg-note">' + esc(Tf('tbl.editNote', { mode: T(t.mode === 'choice' ? 'tag.choice' : 'tag.noul') })) + '</div>' +
      '  <label>' + esc(T('tbl.nameLabel')) + '</label>' +
      '  <input id="et-name" value="' + esc(t.name) + '">' +
      '  <label>' + esc(T('tbl.noteLabel')) + '</label>' +
      '  <input id="et-note" value="' + esc(t.note || '') + '">' +
      '  <div class="actions"><button class="btn" id="et-cancel">' + esc(T('dlg.cancel')) + '</button>' +
      '  <button class="btn primary" id="et-ok">' + esc(T('dlg.save')) + '</button></div>' +
      '</div>');
    ov.querySelector('#et-cancel').onclick = () => ov.remove();
    ov.querySelector('#et-ok').onclick = async () => {
      const name = ov.querySelector('#et-name').value.trim();
      const note = ov.querySelector('#et-note').value.trim();
      if (!name) { toast(T('toast.tblNameEmpty'), true); return; }
      const body = {};
      if (name !== t.name) body.name = name;
      if (note !== (t.note || '')) body.note = note;
      if (!Object.keys(body).length) { ov.remove(); return; }
      ov.querySelector('#et-ok').disabled = true;
      try {
        const out = await apiSend('/api/tables?id=' + encodeURIComponent(t.id), 'PUT', body);
        ov.remove();
        toast(Tf('toast.tblSaved', { name: out.name, note: out.note ? '· ' + out.note : '' }));
        if (onSaved) onSaved(out);
      } catch (e) {
        toast(T('toast.saveFail') + ': ' + e, true);
        ov.querySelector('#et-ok').disabled = false;
      }
    };
  }

  function confirmDeleteTable(t) {
    const ov = openOverlay(
      '<div class="dialog">' +
      '  <h3>' + esc(Tf('tbl.delTitle', { name: t.name })) + '</h3>' +
      '  <div class="dlg-note">' + esc(Tf('tbl.delNote', { id: t.id })) + '</div>' +
      '  <div class="actions"><button class="btn" id="dt-cancel">' + esc(T('dlg.cancel')) + '</button>' +
      '  <button class="btn danger" id="dt-ok">' + esc(T('tbl.delBtn')) + '</button></div>' +
      '</div>');
    ov.querySelector('#dt-cancel').onclick = () => ov.remove();
    ov.querySelector('#dt-ok').onclick = async () => {
      ov.querySelector('#dt-ok').disabled = true;
      try {
        await apiSend('/api/tables?id=' + encodeURIComponent(t.id), 'DELETE', null);
        ov.remove();
        toast(Tf('toast.tblDeleted', { name: t.name }));
        loadTables();
      } catch (e) {
        toast(T('toast.delTableFail') + ': ' + e, true);
        ov.querySelector('#dt-ok').disabled = false;
      }
    };
  }

  // 新建表：命名 + 分支方式（noul/choice 建表时定死）+ 备注
  function syncModeDesc() {
    const v = document.querySelector('input[name="nt-mode"]:checked').value;
    $('#nt-mode-desc').textContent = T(v === 'choice' ? 'modeDesc.choice' : 'modeDesc.noul');
  }
  for (const r of document.querySelectorAll('input[name="nt-mode"]')) r.onchange = syncModeDesc;
  syncModeDesc();

  $('#nt-go').onclick = async () => {
    const name = $('#nt-name').value.trim();
    const mode = document.querySelector('input[name="nt-mode"]:checked').value;
    const note = $('#nt-note').value.trim();
    if (!name) { toast(T('toast.needName'), true); return; }
    $('#nt-go').disabled = true;
    try {
      const out = await apiSend('/api/tables', 'POST', { name, mode, note });
      $('#nt-name').value = ''; $('#nt-note').value = '';
      toast(Tf('toast.tblCreated', { name: out.name, mode: out.mode }));
      location.hash = '#/t/' + encodeURIComponent(out.id);
    } catch (e) {
      toast(T('toast.tblCreateFail') + ': ' + e, true);
    }
    $('#nt-go').disabled = false;
  };

  // ── 表内视图 ───────────────────────────────────────────────────

  async function openTable(id) {
    state.tid = id;
    try {
      const d = await api(T0());   // 表元信息 + metaMap
      state.mode = d.meta.mode;
      state.gate = d.meta.noulGate;
      state.choiceGate = d.meta.choiceGate;
      $('#tblName').textContent = d.name;
      $('#tblName').title = d.note || d.name;
      $('#tblName').style.display = '';
      $('#tblEdit').style.display = '';
      state.tinfo = d;
      const mt = $('#tblMode');
      mt.textContent = T(d.mode === 'choice' ? 'tag.choice' : 'tag.noul');
      mt.className = 'mode-tag ' + d.mode;
      mt.style.display = '';
      $('#backBtn').style.display = '';
      $('#startView').style.display = 'none';
      $('#treePanel').style.display = '';
      $('#detailPanel').style.display = '';
      $('#gateLb').style.display = '';
      document.title = d.name + ' · ' + T('app.titleShort');
      renderStats(d.meta);
      state.expanded = new Set();
      state.containers = {};
      state.wraps = {};
      state.selectedRow = null;
      $('#tree').innerHTML = '<div class="loading">' + esc(T('tree.loading')) + '</div>';
      const nd = await api(T0() + '/node');   // 初始只取根一层
      $('#tree').innerHTML = '';
      $('#tree').appendChild(buildRow(nd.node, 0));
      $('#detailEmpty').style.display = '';
      $('#detail').style.display = 'none';
      showTab('detail');
    } catch (e) {
      toast(T('toast.openFail') + ': ' + e, true);
      location.hash = '#/';
    }
  }
  $('#backBtn').onclick = () => { location.hash = '#/'; };
  $('#tblEdit').onclick = () => {
    if (state.tinfo) openTableEditDialog(state.tinfo, out => {
      state.tinfo = Object.assign({}, state.tinfo, out);
      $('#tblName').textContent = out.name;
      $('#tblName').title = out.note || out.name;
      document.title = out.name + ' · ' + T('app.titleShort');
    });
  };

  function gateVal() { return state.mode === 'choice' ? state.choiceGate : state.gate; }

  function applyGateLabel() {
    const choice = state.mode === 'choice';
    $('#gateLbTxt').textContent = T(choice ? 'gate.choice' : 'gate.noul');
    $('#gateLb').title = T(choice ? 'gate.choiceTitle' : 'gate.noulTitle');
    const g = $('#gate');
    if (document.activeElement !== g) g.value = gateVal();
  }

  function renderStats(m) {
    $('#stats').textContent = Tf('hdr.docs', { n: m.docCount });
    if (state.mode === 'choice' && m.choiceGate != null) state.choiceGate = m.choiceGate;
    if (m.noulGate != null) state.gate = m.noulGate;
    applyGateLabel();   // 门控标签与输入框随 meta 同步（正在编辑时不覆盖）
  }

  $('#gate').addEventListener('change', async () => {
    const v = parseFloat($('#gate').value);
    const choice = state.mode === 'choice';
    const label = T(choice ? 'gate.choice' : 'gate.noul');
    if (!(v > 0 && v <= 1)) { toast(Tf('toast.gateRange', { label }), true); $('#gate').value = gateVal(); return; }
    try {
      const out = await apiSend(T0() + '/gate', 'POST', choice ? { choiceGate: v } : { noulGate: v });
      if (choice) state.choiceGate = out.choiceGate; else state.gate = out.noulGate;
      $('#gate').value = gateVal();
      toast(Tf('toast.gateOk', { label, value: gateVal() }));
    } catch (e) {
      toast(T('toast.gateFail') + ': ' + e, true);
      $('#gate').value = gateVal();
    }
  });

  // ── 逐层展开树 ─────────────────────────────────────────────────

  // 一行（图标+名+判据）+ 子容器；左键任意节点开右侧详情，内部节点同时展开/收起一层
  function buildRow(node, depth) {
    const wrap = document.createElement('div');
    wrap.className = 'node ' + (node.leaf ? 'leaf' : 'internal') + (node.other ? ' other' : '');
    state.wraps[node.name] = wrap;

    const row = document.createElement('div');
    row.className = 'row clickable' + (node.other ? ' other' : '') + (node.docCount ? '' : ' zero');
    row.style.marginLeft = (depth * 18) + 'px';
    row.dataset.name = node.name;
    row.dataset.depth = depth;

    const chev = document.createElement('span');
    chev.className = 'chev';
    if (!node.leaf) chev.textContent = state.expanded.has(node.name) ? '▾' : '▸';
    row.appendChild(chev);

    const icon = document.createElement('span');
    icon.className = 'icon';
    icon.textContent = node.leaf ? '◇' : '◆';
    row.appendChild(icon);

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = node.name;
    row.appendChild(name);

    if (node.other) {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = T(state.mode === 'choice' ? 'tag.otherChoice' : 'tag.otherNoul');
      row.appendChild(tag);
    }
    if (node.leaf) {
      const badge = document.createElement('span');
      badge.className = 'badge' + (node.docCount ? '' : ' zero');
      badge.textContent = node.docCount;
      badge.title = T('badge.docCount');
      row.appendChild(badge);
    }
    if (node.yes) {
      const crit = document.createElement('div');
      crit.className = 'crit';
      crit.textContent = (state.mode === 'choice' ? '» ' : '✓ ') + node.yes;
      if (node.no) crit.title = '✗ ' + node.no;
      row.appendChild(crit);
    }

    row.oncontextmenu = e => { e.preventDefault(); e.stopPropagation(); openMenu(e.clientX, e.clientY, node, row); };

    if (node.leaf) {
      row.onclick = () => selectNode(node.name, row);
      wrap.appendChild(row);
      return wrap;
    }

    row.onclick = () => { selectNode(node.name, row); toggleNode(node, row); };
    wrap.appendChild(row);

    const kids = document.createElement('div');
    kids.className = 'kids';
    wrap.appendChild(kids);
    state.containers[node.name] = kids;

    if (state.expanded.has(node.name)) {
      if (node.children && node.children.length) {
        for (const c of node.children) kids.appendChild(buildRow(c, depth + 1));
      } else {
        loadChildren(node.name, depth).catch(e => toast(T('toast.loadFail') + ': ' + e, true));
      }
    }
    return wrap;
  }

  async function toggleNode(node, row) {
    const kids = state.containers[node.name];
    const chev = row.querySelector('.chev');
    const depth = parseInt(row.dataset.depth, 10);
    if (state.expanded.has(node.name)) {          // 再点收起
      state.expanded.delete(node.name);
      kids.innerHTML = '';
      chev.textContent = '▸';
      return;
    }
    state.expanded.add(node.name);                // 点一下查下一级
    chev.textContent = '…';
    try {
      await loadChildren(node.name, depth);
      chev.textContent = '▾';
    } catch (e) {
      state.expanded.delete(node.name);
      chev.textContent = '▸';
      toast(T('toast.loadFail') + ': ' + e, true);
    }
  }

  async function loadChildren(name, depth) {
    const d = await api(T0() + '/node?name=' + encodeURIComponent(name));
    const kids = state.containers[name];
    if (!kids) return;
    kids.innerHTML = '';
    for (const c of (d.node.children || [])) kids.appendChild(buildRow(c, depth + 1));
  }

  // 增长/分化后原位重建该节点（叶→内部节点也能正确换行）
  async function refreshNode(name) {
    const wrap = state.wraps[name];
    if (!wrap) return;
    const depth = parseInt(wrap.querySelector('.row').dataset.depth, 10);
    const d = await api(T0() + '/node?name=' + encodeURIComponent(name));
    state.expanded.add(name);
    wrap.replaceWith(buildRow(d.node, depth));
  }

  $('#expandAll').onclick = async () => {
    try {
      const t = await api(T0() + '/tree');
      state.mode = t.mode;
      renderStats(t);
      const acc = new Set();
      (function collect(n) {
        if (!n.leaf) { acc.add(n.name); (n.children || []).forEach(collect); }
      })(t.root);
      state.expanded = acc;
      state.containers = {};
      state.wraps = {};
      const box = $('#tree');
      box.innerHTML = '';
      box.appendChild(buildRow(t.root, 0));
    } catch (e) {
      toast(T('toast.loadFail') + ': ' + e, true);
    }
  };

  // ── 右键菜单 + 增加判断节点 ────────────────────────────────────

  let menuEl = null;
  function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }
  document.addEventListener('click', closeMenu);

  function openMenu(x, y, node, row) {
    closeMenu();
    if (node.other) {              // 兜底：随父节点连带管理
      toast(T(state.mode === 'choice' ? 'other.toastChoice' : 'other.toastNoul'));
      return;
    }
    menuEl = document.createElement('div');
    menuEl.className = 'menu';
    const editItem = () => {
      const e = document.createElement('div');
      e.textContent = T(state.mode === 'choice' ? 'menu.editChoice' : 'menu.editNoul');
      e.onclick = () => { closeMenu(); openEditDialog(node); };
      menuEl.appendChild(e);
    };
    {
      const item = document.createElement('div');
      item.textContent = T(state.mode === 'choice' ? 'menu.addChoice' : 'menu.addNoul');
      item.onclick = () => { closeMenu(); openDialog(node); };
      menuEl.appendChild(item);
      if (row.dataset.depth !== '0') {        // 根节点不可改不可删
        editItem();
        const del = document.createElement('div');
        del.textContent = T('menu.del');
        del.style.color = '#ef7d7d';
        del.onclick = () => { closeMenu(); confirmDelete(node); };
        menuEl.appendChild(del);
      }
    }
    document.body.appendChild(menuEl);
    const r = menuEl.getBoundingClientRect();
    menuEl.style.left = Math.min(x, innerWidth - r.width - 8) + 'px';
    menuEl.style.top = Math.min(y, innerHeight - r.height - 8) + 'px';
  }

  function openDialog(parentNode) {
    const choice = state.mode === 'choice';
    const scope = choice
        ? (parentNode.leaf ? T('dlg.scopeChoiceLeaf') : T('dlg.scopeChoiceInternal'))
        : (parentNode.leaf
            ? Tf('dlg.scopeNoulLeaf', { other: parentNode.name + '_OTHER' })
            : Tf('dlg.scopeNoulInternal', { other: parentNode.name + '_OTHER' }));
    const ov = openOverlay(
      '<div class="dialog">' +
      '  <h3>' + esc(Tf(choice ? 'dlg.addTitleChoice' : 'dlg.addTitleNoul', { parent: parentNode.name })) + '</h3>' +
      '  <div class="dlg-note">' + esc(scope + (choice ? '' : T('dlg.critHint'))) + '</div>' +
      '  <label>' + esc(T(choice ? 'dlg.nameLabelChoice' : 'dlg.nameLabelNoul')) + '</label>' +
      '  <input id="jn-name" placeholder="' + esc(T(choice ? 'dlg.namePhChoice' : 'dlg.namePhNoul')) + '">' +
      '  <label>' + esc(T(choice ? 'dlg.yesLabelChoice' : 'dlg.yesLabelNoul')) + '</label>' +
      '  <input id="jn-yes" placeholder="' + esc(T(choice ? 'dlg.yesPhChoice' : 'dlg.yesPhNoul')) + '">' +
      (choice ? '' :
      '  <label>' + esc(T('dlg.noLabel')) + '</label>' +
      '  <input id="jn-no" placeholder="">') +
      '  <div class="actions"><button class="btn" id="jn-cancel">' + esc(T('dlg.cancel')) + '</button>' +
      '  <button class="btn primary" id="jn-ok">' + esc(T('dlg.create')) + '</button></div>' +
      '</div>');
    ov.querySelector('#jn-cancel').onclick = () => ov.remove();
    const val = id => ov.querySelector('#' + id).value.trim();
    ov.querySelector('#jn-ok').onclick = async () => {
      const body = { parent: parentNode.name, name: val('jn-name'), yes: choice ? (val('jn-yes') || '') : val('jn-yes'), no: choice ? '' : (val('jn-no') || '') };
      if (!body.name || (!choice && !body.yes)) { toast(T(choice ? 'dlg.errChoice' : 'dlg.errNoul'), true); return; }
      ov.querySelector('#jn-ok').disabled = true;
      try {
        const out = await apiSend(T0() + '/node', 'POST', body);
        ov.remove();
        const movedTxt = (out.moves || []).filter(m => m.moved)
            .map(m => m.docId + ' ' + (+m.prob).toFixed(2)).join('、');
        toast(Tf('toast.added', { node: out.node, judged: out.judged }) +
              (movedTxt ? T('toast.movedIn') + movedTxt : T('toast.movedNone')));
        await refreshNode(parentNode.name);
      } catch (e) {
        toast(T('dlg.growFail') + ': ' + e, true);
        ov.querySelector('#jn-ok').disabled = false;
      }
    };
  }

  // ── 修改节点（改名 + 改判据，零模型调用）──────────────────────

  function renameKey(oldName, newName) {
    if (state.expanded.has(oldName)) { state.expanded.delete(oldName); state.expanded.add(newName); }
    if (state.containers[oldName]) { state.containers[newName] = state.containers[oldName]; delete state.containers[oldName]; }
    if (state.wraps[oldName]) { state.wraps[newName] = state.wraps[oldName]; delete state.wraps[oldName]; }
    const w = state.wraps[newName];
    if (w) { const r = w.querySelector('.row'); if (r) r.dataset.name = newName; }
  }

  function openEditDialog(node) {
    const choice = state.mode === 'choice';
    const ov = openOverlay(
      '<div class="dialog">' +
      '  <h3>' + esc(Tf(choice ? 'dlg.editTitleChoice' : 'dlg.editTitleNoul', { name: node.name })) + '</h3>' +
      '  <div class="dlg-note">' + esc(T('dlg.editNote')) + '</div>' +
      '  <label>' + esc(T(choice ? 'dlg.edNameChoice' : 'dlg.edNameNoul')) + '</label>' +
      '  <input id="ed-name" value="' + esc(node.name) + '">' +
      '  <label>' + esc(T(choice ? 'dlg.edYesChoice' : 'dlg.edYesNoul')) + '</label>' +
      '  <input id="ed-yes" value="' + esc(node.yes || '') + '">' +
      (choice ? '' :
      '  <label>' + esc(T('dlg.noLabel')) + '</label>' +
      '  <input id="ed-no" value="' + esc(node.no || '') + '">') +
      '  <div class="actions"><button class="btn" id="ed-cancel">' + esc(T('dlg.cancel')) + '</button>' +
      '  <button class="btn primary" id="ed-ok">' + esc(T('dlg.save')) + '</button></div>' +
      '</div>');
    ov.querySelector('#ed-cancel').onclick = () => ov.remove();
    const val = id => ov.querySelector('#' + id).value.trim();
    ov.querySelector('#ed-ok').onclick = async () => {
      const body = { name: node.name, newName: val('ed-name'), yes: choice ? (val('ed-yes') || '') : val('ed-yes'), no: choice ? null : (val('ed-no') || null) };
      if (!body.newName) { toast(T('dlg.errNameEmpty'), true); return; }
      ov.querySelector('#ed-ok').disabled = true;
      try {
        const out = await apiSend(T0() + '/node', 'PUT', body);
        ov.remove();
        const renamed = out.newName !== out.oldName;
        if (renamed) renameKey(out.oldName, out.newName);
        toast(Tf('toast.editDone', { name: out.newName }) + (renamed ? Tf('toast.renamed', { old: out.oldName }) : ''));
        if (out.parent) await refreshNode(out.parent);
        if (state.selectedRow && !document.body.contains(state.selectedRow)) {
          state.selectedRow = null;
          $('#detail').style.display = 'none';
          $('#detailEmpty').style.display = '';
        }
      } catch (e) {
        toast(T('dlg.editFail') + ': ' + e, true);
        ov.querySelector('#ed-ok').disabled = false;
      }
    };
  }

  // ── 删除节点（确认后删子树 + 清理落位）────────────────────────

  function confirmDelete(node) {
    const ov = openOverlay(
      '<div class="dialog">' +
      '  <h3>' + esc(Tf('dlg.delTitle', { name: node.name })) + '</h3>' +
      '  <div class="dlg-note">' + esc(T('dlg.delNote')) + '</div>' +
      '  <div class="actions"><button class="btn" id="del-cancel">' + esc(T('dlg.cancel')) + '</button>' +
      '  <button class="btn danger" id="del-ok">' + esc(T('tbl.delBtn')) + '</button></div>' +
      '</div>');
    ov.querySelector('#del-cancel').onclick = () => ov.remove();
    ov.querySelector('#del-ok').onclick = async () => {
      ov.querySelector('#del-ok').disabled = true;
      try {
        const out = await apiSend(T0() + '/node?name=' + encodeURIComponent(node.name), 'DELETE', null);
        ov.remove();
        const removed = out.removed || [];
        for (const n of removed) {
          state.expanded.delete(n);
          delete state.containers[n];
          delete state.wraps[n];
        }
        if (state.selectedRow && removed.includes(state.selectedRow.dataset.name)) {
          state.selectedRow = null;
          $('#detail').style.display = 'none';
          $('#detailEmpty').style.display = '';
        }
        renderStats(out);
        toast(Tf('toast.delDone', { name: node.name, nodes: removed.length, docs: (out.docsRemoved || []).length }));
        await refreshNode(out.parent);
      } catch (e) {
        toast(T('dlg.delFail') + ': ' + e, true);
        ov.querySelector('#del-ok').disabled = false;
      }
    };
  }

  // ── 节点详情（叶与内部节点共用视图，不点不显示）────────────────

  async function selectNode(name, rowEl) {
    showTab('detail');
    if (state.selectedRow) state.selectedRow.classList.remove('selected');
    state.selectedRow = rowEl;
    rowEl.classList.add('selected');

    $('#detailEmpty').style.display = 'none';
    const d = $('#detail');
    d.style.display = 'block';
    d.innerHTML = '<div class="loading">' + esc(T('detail.loading')) + '</div>';
    try {
      const info = await api(T0() + '/leaf?name=' + encodeURIComponent(name));
      state.ndName = info.leaf ? null : name;   // 节点直取响应的竞态守卫（选中已切换则丢弃）
      renderDetail(info);
      if (!info.leaf) loadNodeDocs(name);
    } catch (e) {
      d.innerHTML = '<div class="error">' + esc(e) + '</div>';
    }
  }

  function renderDetail(info) {
    const isNode = !info.leaf;
    const crumbs = info.path.map(p => '<span class="crumb">' + esc(p) + '</span>')
        .join('<span class="sep">▸</span>');
    let html =
      '<div class="d-head"><span class="d-name">' + esc(info.name) + '</span>' +
      (info.other ? '<span class="tag">' + esc(T(state.mode === 'choice' ? 'tag.otherChoice' : 'tag.otherNoul')) + '</span>' : '') +
      '<span class="d-count">' + esc(Tf(isNode ? 'detail.subtreeDocs' : 'detail.leafDocs', { n: isNode ? info.docTotal : info.docs.length })) + '</span></div>' +
      '<div class="crumbs">' + crumbs + '</div>';
    if (info.yes || info.no) {
      html += '<div class="d-crit"><div>' + (state.mode === 'choice' ? '» ' : '✓ ') + esc(info.yes) + '</div>' +
              (state.mode === 'choice' ? '' : '<div>✗ ' + esc(info.no || '—') + '</div>') + '</div>';
    } else if (info.other) {
      html += '<div class="d-crit">' + esc(Tf(state.mode === 'choice'
          ? 'detail.otherChoice' : 'detail.otherNoul', { gate: state.choiceGate })) + '</div>';
    }
    if (isNode) {
      html += '<div class="d-sub">' + esc(Tf('detail.children', { n: (info.children || []).length })) + '</div>';
      for (const c of (info.children || [])) {
        html += '<div class="row">' +
            '<span class="icon" style="color:' + (c.leaf ? '#e8b64c' : '#5eead4') + '">' + (c.leaf ? '◇' : '◆') + '</span>' +
            '<span class="name"' + (c.leaf ? ' style="color:#f2d38b"' : '') + '>' + esc(c.name) + '</span>' +
            (c.other ? '<span class="tag">' + esc(T(state.mode === 'choice' ? 'tag.otherChoice' : 'tag.otherNoul')) + '</span>' : '') +
            (c.leaf ? '<span class="badge' + (c.docCount ? '' : ' zero') + '">' + c.docCount + '</span>' : '') +
            (c.yes ? '<div class="crit">' + (state.mode === 'choice' ? '» ' : '✓ ') + esc(c.yes) + '</div>' : '') +
            '</div>';
      }
      html += '<div class="d-sub" id="nd-head">' + esc(T('detail.subContent')) + '</div><div id="nd-list"></div>';
    } else {
      html += '<div class="d-sub">' + esc(T('detail.docs')) + '</div>';
      if (!info.docs.length) {
        html += '<div class="d-none">' + esc(T('detail.noDocs')) + '</div>';
      } else {
        for (const doc of info.docs) {
          html += '<div class="doc"><span class="doc-id">' + esc(doc.id) + '</span>' +
                  '<div class="doc-content">' + esc(doc.content) + '</div></div>';
        }
      }
    }
    $('#detail').innerHTML = html;
  }

  /** 节点直取：分页拉取子树落位内容（每次 10 条），填进详情面板；选中已切换则丢弃响应。 */
  async function loadNodeDocs(name, append) {
    const offset = append ? (state.ndOffset || 0) : 0;
    try {
      const nd = await api(T0() + '/docs?node=' + encodeURIComponent(name) + '&limit=10&offset=' + offset);
      if (state.ndName !== name) return;
      const head = $('#nd-head'), list = $('#nd-list');
      if (!head || !list) return;
      if (!append) {
        list.innerHTML = '';
        head.textContent = Tf('detail.subContentN', { n: nd.total });
        if (!nd.docs.length) {
          list.innerHTML = '<div class="d-none">' + esc(T('detail.noDocs')) + '</div>';
          return;
        }
      }
      const more = $('#nd-more');
      if (more) more.remove();
      let html = '';
      for (const doc of nd.docs) {
        html += '<div class="doc"><span class="doc-id">' + esc(doc.id) + '</span>' +
                '<div class="doc-content">' + esc(doc.content) + '</div>' +
                (doc.viaLeaves && doc.viaLeaves.length
                    ? '<div class="doc-via">@' + doc.viaLeaves.map(esc).join(' · @') + '</div>' : '') +
                '</div>';
      }
      list.insertAdjacentHTML('beforeend', html);
      state.ndOffset = offset + nd.docs.length;
      if (nd.truncated) {
        list.insertAdjacentHTML('beforeend',
            '<div class="d-more" id="nd-more">' + esc(Tf('detail.loadMore', { n: nd.total })) + '</div>');
        $('#nd-more').onclick = () => loadNodeDocs(name, true);
      }
    } catch (e) {
      if (state.ndName === name) {
        const list = $('#nd-list');
        if (list) list.innerHTML = '<div class="error">' + esc(e) + '</div>';
      }
    }
  }

  let toastTimer = null;
  function toast(msg, err) {
    let t = document.getElementById('toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'toast';
      t.className = 'toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.className = 'toast' + (err ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.remove(), 4500);
  }

  // ── 右栏页签 ───────────────────────────────────────────────────

  function showTab(name) {
    for (const b of document.querySelectorAll('.tabs > .tab')) {
      b.classList.toggle('active', b.dataset.tab === name);
    }
    $('#tab-detail').style.display = name === 'detail' ? '' : 'none';
    $('#tab-quest').style.display = name === 'quest' ? '' : 'none';
  }
  for (const b of document.querySelectorAll('.tabs > .tab')) {
    b.onclick = () => showTab(b.dataset.tab);
  }

  // ── 模型选择栏（全局后端/模型，对所有表生效）───────────────────

  async function initModelBar() {
    if (state.modelBarInit) return;
    state.modelBarInit = true;
    $('#provider').onchange = () => loadModels($('#provider').value, null);
    $('#modelFilter').oninput = applyModelFilter;
    $('#model').onchange = switchModel;
    try {
      const cur = await api('/api/model');
      $('#provider').value = cur.provider;
      await loadModels(cur.provider, cur.model);
    } catch (e) { /* 选择栏维持空态，不影响表 */ }
  }

  async function loadModels(provider, current) {
    const sel = $('#model');
    sel.innerHTML = '<option value="">' + esc(T('model.loading')) + '</option>';
    try {
      const d = await api('/api/models?provider=' + encodeURIComponent(provider));
      state.allModels = d.models || [];
      sel.innerHTML = '';
      const ph = document.createElement('option');
      ph.value = '';
      ph.textContent = T('model.pickPh');
      sel.appendChild(ph);
      for (const m of state.allModels) {
        const o = document.createElement('option');
        o.value = m.id;
        o.textContent = m.id + (m.free ? T('model.free') : '') + (m.decisions ? ' ⚡' : '');
        sel.appendChild(o);
      }
      applyModelFilter();
      // 只有页面初始恢复「当前活跃模型」才回显选中；切 provider 一律停在占位——
      // 必须显式选一次模型（触发 change → POST /api/model）才真正热切换，
      // 避免程序赋值不触发 change 造成的"看起来选了、实际后端没切"假象
      if (current && [...sel.options].some(o => o.value === current)) sel.value = current;
      if (d.source === 'fallback') toast(T('model.fallback'));
    } catch (e) {
      sel.innerHTML = '<option value="">' + esc(T('model.unavailable')) + '</option>';
    }
  }

  function applyModelFilter() {
    const kw = $('#modelFilter').value.trim().toLowerCase();
    const sel = $('#model');
    const cur = sel.value;
    for (const o of sel.options) {
      if (!kw) { o.style.display = ''; continue; }
      const m = state.allModels.find(x => x.id === o.value) || {};
      const hay = (o.value + ' ' + (m.name || '')).toLowerCase();
      o.style.display = hay.includes(kw) ? '' : 'none';
    }
    if (kw && ![...sel.options].some(o => o.style.display === '' && o.value === cur)) {
      const first = [...sel.options].find(o => o.style.display === '');
      if (first) sel.value = first.value;
    }
  }

  async function switchModel() {
    const provider = $('#provider').value;
    const model = $('#model').value;
    if (!model) return;
    $('#model').disabled = true;
    try {
      const out = await apiSend('/api/model', 'POST', { provider, model });
      toast(Tf('model.switched', { backend: out.backend, model: out.model }));
    } catch (e) {
      toast(T('model.switchFail') + ': ' + e, true);
      await loadModels(provider, null);
    }
    $('#model').disabled = false;
  }

  // ── 控制台（add 落位：单条/批量子模式 / search 检索；批量空行分隔，统一走 addBatch）──

  let consoleMode = 'add';
  let addSub = 'single';   // add 子模式：single 单条（整框一条） / batch 批量（空行分隔）
  function setMode(m) {
    consoleMode = m;
    for (const b of document.querySelectorAll('#q-mainmodes .tab')) {
      b.classList.toggle('active', b.dataset.mode === m);
    }
    $('#q-submodes').style.display = m === 'add' ? '' : 'none';
    $('#q-id-row').style.display = m === 'add' && addSub === 'single' ? '' : 'none';
    refreshConsoleBar();
  }
  function setAddSub(s) {
    addSub = s;
    for (const b of document.querySelectorAll('#q-submodes .tab')) {
      b.classList.toggle('active', b.dataset.sub === s);
    }
    $('#q-id-row').style.display = s === 'single' && consoleMode === 'add' ? '' : 'none';
    refreshConsoleBar();
  }
  // 按钮 / 提示 / 占位符随主模式 + add 子模式刷新（语言切换时 applyI18n 也会重调）
  function refreshConsoleBar() {
    $('#q-go').textContent = T(consoleMode === 'add' ? 'q.goAdd' : 'q.goSearch');
    if (consoleMode !== 'add') {
      $('#q-hint').textContent = T('q.hintSearch');
      $('#q-input').placeholder = T('q.phSearch');
      return;
    }
    $('#q-hint').textContent = T(addSub === 'single' ? 'q.hintAddSingle' : 'q.hintBatch');
    $('#q-input').placeholder = T(addSub === 'batch' ? 'q.phBatch'
        : (state.mode === 'choice' ? 'q.phAddChoice' : 'q.phAddNoul'));
  }
  for (const b of document.querySelectorAll('#q-mainmodes .tab')) {
    b.onclick = () => setMode(b.dataset.mode);
  }
  for (const b of document.querySelectorAll('#q-submodes .tab')) {
    b.onclick = () => setAddSub(b.dataset.sub);
  }

  async function runConsole() {
    const text = $('#q-input').value.trim();
    if (!text) { toast(T(consoleMode === 'add' ? 'q.emptyAdd' : 'q.emptySearch'), true); return; }
    const out = $('#q-out');
    out.innerHTML = '<div class="loading">' + esc(T(consoleMode === 'add' ? 'q.loadingAdd' : 'q.loadingQuest')) + '</div>';
    try {
      if (consoleMode === 'add') {
        let docs;
        if (addSub === 'batch') {          // 批量：空行分隔；段内换行属于该条内容，ID 自动生成
          docs = text.split(/\n[ \t]*\n/).map(s => s.trim()).filter(s => s.length)
              .map(content => ({ content }));
        } else {                          // 单条：整框为一条，换行属于内容；ID 可指定
          const doc = { content: text };
          const idv = $('#q-doc-id').value.trim();
          if (idv) doc.id = idv;
          docs = [doc];
        }
        const d = await apiSend(T0() + '/addBatch', 'POST', { docs });
        if (docs.length === 1 && !(d.failed || []).length) renderAdd(d);
        else renderAddBatch(d);
      } else {
        renderQuest(await apiSend(T0() + '/quest', 'POST', { query: text }));
      }
    } catch (e) {
      out.innerHTML = '<div class="error">' + esc(e) + '</div>';
    }
  }
  $('#q-go').onclick = runConsole;
  $('#q-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); runConsole(); }
  });

  // 判定轨迹一步：choice 模式显示胜出选项与置信度，noul 模式显示各分支 P(yes)
  // probs 概率表 → "name 0.87 · name 0.05" 形式
  const fmtProbs = s => Object.keys(s.probs || {})
      .map(k => k + ' ' + (s.probs[k] == null ? '—' : (+s.probs[k]).toFixed(2))).join(' · ');

  function stepLine(s) {
    if (s.choice != null) {
      let t = '✓ ' + esc(s.choice) + ' · ' + (s.confidence != null ? (+s.confidence).toFixed(2) : '—');
      if (Object.keys(s.probs || {}).length > 1) t += ' <span class="dim">· ' + esc(fmtProbs(s)) + '</span>';
      return t;
    }
    return esc(fmtProbs(s));
  }

  function traceHtml(steps) {
    let html = '<details class="judge"><summary>' + esc(Tf('add.trace', { n: steps.length })) + '</summary>';
    for (const s of steps) {
      html += '<div class="q-step"><b>@' + esc(s.node) + '</b> ' + stepLine(s) +
          ' <span class="dim">[' + s.latencyMs + 'ms · in ' + s.inputTokens + ' / out ' + s.outputTokens + ']</span></div>';
    }
    return html + '</details>';
  }

  // 已展开的落位叶原位刷新计数（落位 / 批量导入后）
  function refreshLeafRows(leaves) {
    for (const lf of leaves) {
      if (state.wraps[lf]) refreshNode(lf).catch(() => {});
    }
  }

  function renderAdd(d) {   // d = addBatch 响应（单条也走 addBatch，取 results[0]）
    const r = (d.results || [])[0] || {};
    let html = '<div class="q-sub">' + esc(Tf('add.done', { id: r.id })) + '</div>';
    html += (r.leaves || []).length
        ? '<div>' + r.leaves.map(l => '<span class="chip">' + esc(l) + '</span>').join('') + '</div>'
        : '<div class="q-none">' + esc(T(state.mode === 'choice' ? 'add.noLeafChoice' : 'add.noLeafNoul')) + '</div>';
    html += traceHtml(r.steps || []);
    html += '<div class="q-meta" style="margin-top:10px">' + esc(d.stats || '') + '</div>';
    $('#q-out').innerHTML = html;
    renderStats(d);
    refreshLeafRows(r.leaves || []);
  }

  function renderAddBatch(d) {
    let html = '<div class="q-sub">' + esc(Tf('batch.done', { ok: d.added, fail: (d.failed || []).length, total: d.total })) + '</div>';
    for (const r of (d.results || [])) {
      html += '<div style="margin-bottom:4px"><span class="doc-id">' + esc(r.id) + '</span>' +
          (r.leaves || []).map(l => '<span class="chip">' + esc(l) + '</span>').join('') + '</div>';
    }
    for (const f of (d.failed || [])) {
      html += '<div class="q-step" style="color:#ef7d7d">' + esc(Tf('batch.rowFail', { index: f.index, error: f.error })) + '</div>';
    }
    html += '<div class="q-meta" style="margin-top:10px">' + esc(d.stats || '') + '</div>';
    $('#q-out').innerHTML = html;
    renderStats(d);
    const hitLeaves = new Set();
    for (const r of (d.results || [])) (r.leaves || []).forEach(l => hitLeaves.add(l));
    refreshLeafRows(hitLeaves);
  }

  function renderQuest(d) {
    let html = '<div class="q-sub">' + esc(Tf('quest.hits', { n: d.matchedLeaves.length || 0 })) +
        (d.fastPath ? '<span class="fast-badge">' + esc(T('quest.fast')) + '</span>' : '') + '</div>';
    html += d.matchedLeaves.length
        ? '<div>' + d.matchedLeaves.map(l => '<span class="chip">' + esc(l) + '</span>').join('') + '</div>'
        : '<div class="q-none">' + esc(Tf(state.mode === 'choice'
            ? 'quest.noHitChoice' : 'quest.noHitNoul', { gate: gateVal() })) + '</div>';
    html += '<div class="q-sub">' + esc(Tf('quest.rank', { n: d.ranked.length })) +
        '<span class="dim">' + esc(T(state.mode === 'choice' ? 'quest.scoreChoice' : 'quest.scoreNoul')) + '</span></div>';
    html += d.ranked.length
        ? d.ranked.map(r =>
            '<div class="q-rank"><span class="q-score">' + esc(fmtScore(r.score)) + '</span>' +
            '<div style="min-width:0"><span class="doc-id">' + esc(r.docId) + '</span>' +
            '<div class="doc-content">' + esc(r.content || '') + '</div>' +
            '<div class="q-meta">via ' + (r.viaLeaves || []).map(esc).join(' + ') + '</div></div></div>').join('')
        : '<div class="q-none">' + esc(T('quest.noDocs')) + '</div>';
    html += traceHtml(d.steps);
    html += '<div class="q-meta" style="margin-top:10px">' + esc(d.stats || '') + '</div>';
    $('#q-out').innerHTML = html;
  }

  // ── 语言切换 ───────────────────────────────────────────────────

  $('#langBtn').onclick = () => {
    LANG = LANG === 'zh' ? 'en' : 'zh';
    localStorage.setItem('sq-lang', LANG);
    applyI18n();
    if (state.tid) openTable(state.tid); else showStart();
  };

  route();
  applyI18n();
  initModelBar();
</script>
</body>
</html>
