<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>DuLeMon 百条记忆 · 生长与体检实时监控</title>
<style>
  :root { --bg:#0f1420; --panel:#171e2e; --line:#25304a; --txt:#d8e0f0; --dim:#7f8cab;
          --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --acc:#60a5fa; --mag:#c084fc; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font:14px/1.55 "PingFang SC","Microsoft YaHei",monospace,sans-serif; padding:14px; }
  header { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:12px; }
  h1 { font-size:17px; color:var(--acc); }
  select,button { background:var(--panel); color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:5px 10px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--acc); }
  #poll { color:var(--dim); font-size:12px; }
  .grid { display:grid; grid-template-columns: 1.15fr 1fr; gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
  .card h2 { font-size:13px; color:var(--mag); margin-bottom:8px; letter-spacing:1px; }
  .kpi { display:flex; gap:10px; flex-wrap:wrap; }
  .kpi div { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:6px 12px; min-width:86px; }
  .kpi b { display:block; font-size:18px; color:var(--acc); }
  .kpi span { font-size:11px; color:var(--dim); }
  .phase { padding:3px 12px; border-radius:99px; font-weight:bold; }
  .phase.idle { background:#1f2a3f; color:var(--dim); }
  .phase.running { background:#274156; color:var(--acc); animation:pulse 1.2s infinite; }
  .phase.done { background:#173b2a; color:var(--ok); }
  .phase.error { background:#3f1d1d; color:var(--bad); }
  @keyframes pulse { 50% { opacity:.55; } }
  #current { color:var(--warn); margin-top:6px; min-height:18px; }
  #result { color:var(--ok); margin-top:4px; min-height:18px; }
  /* 树 */
  .node { margin-left:18px; border-left:1px solid var(--line); padding-left:10px; }
  .nname { font-weight:bold; color:var(--txt); }
  .nname.leaf { color:var(--acc); }
  .nname.other { color:var(--dim); }
  .nyes { color:var(--dim); font-size:12.5px; }
  .ndocs { color:var(--ok); font-size:12px; }
  .flash { animation:fl 1.6s; }
  @keyframes fl { 0% { background:#3b2f14; } 100% { background:transparent; } }
  /* 水位条 */
  .bar { display:flex; align-items:center; gap:8px; margin:4px 0; font-size:12.5px; }
  .bar .lbl { width:130px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track { flex:1; height:10px; background:var(--bg); border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .fill { height:100%; background:var(--acc); }
  .fill.hot { background:var(--warn); }
  .fill.over { background:var(--bad); }
  /* 时间线 */
  #events { max-height:340px; overflow-y:auto; font-size:12.5px; }
  #events .ev { padding:3px 0; border-bottom:1px dashed #223; }
  #events .t { color:var(--dim); margin-right:8px; }
  .ev.kind-rw .m { color:var(--warn); }
  .ev.kind-audit .m { color:var(--mag); }
  .ev.kind-grow .m { color:var(--ok); }
  .ev.kind-cost .m { color:var(--acc); }
  .costline { font-size:12.5px; color:var(--dim); margin-top:6px; }
  .costline b { color:var(--acc); }
  button.danger { border-color:#5a2c2c; color:var(--bad); }
</style>
</head>
<body>
<header>
  <h1>🌱 DuLeMon 百条记忆 · 生长与体检监控</h1>
  <select id="tables"></select>
  <span class="phase idle" id="phase">idle</span>
  <span id="poll">连接中…</span>
  <span class="costline" id="params" style="margin:0"></span>
  <button id="startBtn" style="border-color:#2f5a35;color:var(--ok)" title="自动全程：清除旧同名表→建表→灌入100条→水位自动拆细直至收敛">▶ 开始测试</button>
  <button class="danger" id="clearBtn" title="删除「记忆百条体检」表并清空本地事件时间线">✘ 清除重来</button>
  <button class="danger" id="maintBtn" title="手动触发 ROOT 拆细">手动拆细 /extend</button>
  <span id="run" class="costline" style="margin:0;flex-basis:100%"></span>
</header>

<div class="grid">
  <div>
    <div class="card">
      <h2>判据树（实时 · 判据变更闪烁高亮）</h2>
      <div id="tree">加载中…</div>
    </div>
    <div class="card">
      <h2>各层兜底水位</h2>
      <div id="layers">—</div>
    </div>
  </div>
  <div>
    <div class="card">
      <h2>维护任务（maint）</h2>
      <div class="kpi" id="maintKpi"></div>
      <div id="current"></div>
      <div id="result"></div>
      <div class="costline" id="extra"></div>
    </div>
    <div class="card">
      <h2>Token 账单与成本</h2>
      <div class="kpi" id="billKpi"></div>
      <div class="costline" id="cost"></div>
      <div class="costline" id="gencost"></div>
    </div>
    <div class="card">
      <h2>事件时间线（体检 → 到病 → 治病）</h2>
      <div id="events">—</div>
      <div class="costline"><button onclick="clearEv()">清空时间线</button> <span style="color:var(--dim)">（浏览器本地留存，刷新不丢）</span></div>
    </div>
  </div>
</div>

<script>
const API = "http://127.0.0.1:8787";
const $ = id => document.getElementById(id);
let tid = null, lastTree = {}, lastMaint = {}, timer = null;
const PRICE = { decIn: 0.042, genIn: 0.03, genOut: 0.13 };   // $/M：decision in（out 免费）· qwen in/out
const CNY = 7.1;

async function jget(p) { const r = await fetch(API + p); return r.json(); }

async function loadTables() {
  const ts = await jget("/api/tables");
  const arr = ts.tables || ts || [];
  const sel = $("tables");
  sel.innerHTML = arr.map(t => `<option value="${t.id}">${t.name}（${t.docCount ?? '?'} 条）</option>`).join("");
  const want = arr.find(t => t.name.includes("记忆百条")) || arr[arr.length - 1];
  if (want) { tid = want.id; sel.value = tid; }
}

function esc(s) { return String(s ?? "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

function renderTree(n, depth, out, prev) {
  const cls = n.other ? "other" : (n.leaf ? "leaf" : "");
  const changed = prev && prev.yes !== undefined && prev.yes !== n.yes;
  out.push(`<div class="node ${changed ? "flash" : ""}" style="margin-left:${depth ? 18 : 0}px">`
    + `<span class="nname ${cls}">${esc(n.name)}</span>`
    + (n.docCount ? ` <span class="ndocs">doc=${n.docCount}</span>` : "")
    + (n.yes ? `<div class="nyes">yes: ${esc(n.yes)}</div>` : "")
    + `</div>`);
  for (const c of n.children || []) renderTree(c, depth + 1, out, (prev && prev.children || []).find(x => x.name === c.name));
}

function ev(kind, msg) {
  const key = "dulemon-ev-" + tid;
  const arr = JSON.parse(localStorage.getItem(key) || "[]");
  const t = new Date().toLocaleTimeString("zh-CN", { hour12: false });
  arr.unshift({ t, kind, msg });
  localStorage.setItem(key, JSON.stringify(arr.slice(0, 300)));
  renderEv();
}
function renderEv() {
  const arr = JSON.parse(localStorage.getItem("dulemon-ev-" + tid) || "[]");
  $("events").innerHTML = arr.map(e => `<div class="ev kind-${e.kind}"><span class="t">${e.t}</span><span class="m">${esc(e.msg)}</span></div>`).join("") || "—";
}
function clearEv() { localStorage.removeItem("dulemon-ev-" + tid); renderEv(); }

function diffMaint(p) {
  const l = lastMaint;
  if (l.phase !== "running" && p.phase === "running") ev("audit", "维护任务启动");
  if (p.result && p.result !== l.result) ev("audit", "维护收工：" + p.result);
  if ((p.audits || 0) > (l.audits || 0)) ev("audit", `确诊进入二级（累计 ${p.audits}）——抽取模型开始出提案`);
  if ((p.rewrites || 0) > (l.rewrites || 0)) ev("rw", `判据重写提交 +1（累计 ${p.rewrites}）`);
  if ((p.grew || 0) > (l.grew || 0)) ev("grow", `生长新枝 +1（累计 ${p.grew}）`);
  if ((p.recycled || 0) > (l.recycled || 0)) ev("rw", `摘枝 +1（累计 ${p.recycled}）`);
  if (p.current && p.current !== l.current && p.phase === "running") { /* 仅刷新文案 */ }
}

function renderMaint(p) {
  const ph = $("phase"); ph.textContent = p.phase; ph.className = "phase " + p.phase;
  $("current").textContent = p.phase === "running" ? "▶ " + (p.current || "") : "";
  $("result").textContent = p.result ? "✔ " + p.result : "";
  const k = [["round", p.round], ["audits 确诊", p.audits], ["rewrites 重写", p.rewrites],
             ["recycled 摘枝", p.recycled], ["grew 生长", p.grew], ["genIn", p.genIn], ["genOut", p.genOut]];
  $("maintKpi").innerHTML = k.map(([l, v]) => `<div><b>${v ?? 0}</b><span>${l}</span></div>`).join("");
  const fz = p.frozenLayers || [], rf = p.rewriteFails || [];
  const parts = [];
  if (fz.length) parts.push("❄ 冻结层：" + esc(fz.map(f => typeof f === "string" ? f : JSON.stringify(f)).join("、")));
  if (rf.length) parts.push("⚠ 重写失败：" + esc(rf.map(f => typeof f === "string" ? f : JSON.stringify(f)).join("；")));
  $("extra").textContent = parts.join("　") || "";
}

function renderBill(stats, p) {
  const m = /判定 (\d+) 次请求 · tokens in ([\d,]+) \/ out ([\d,]+)/.exec(stats || "");
  if (!m) { $("billKpi").innerHTML = `<div><b>—</b><span>${esc(stats)}</span></div>`; return; }
  const calls = +m[1], tin = +m[2].replace(/,/g, ""), tout = +m[3].replace(/,/g, "");
  const cost = tin * PRICE.decIn / 1e6 * CNY;                       // decision out 免费
  $("billKpi").innerHTML = [[calls, "判定调用"], [tin.toLocaleString(), "tokens in"], [tout.toLocaleString(), "tokens out"]]
    .map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join("");
  $("cost").innerHTML = `决策模型（microsoft-decision-1，in $${PRICE.decIn}/M · out 免费）：≈ <b>¥${cost.toFixed(4)}</b>`;
  const gi = p.genIn || 0, go = p.genOut || 0;
  const gc = (gi * PRICE.genIn + go * PRICE.genOut) / 1e6 * CNY;
  $("gencost").innerHTML = `生成模型（qwen-flash，in $${PRICE.genIn}/M · out $${PRICE.genOut}/M）：in ${gi.toLocaleString()} / out ${go.toLocaleString()} ≈ <b>¥${gc.toFixed(4)}</b>　合计 ≈ <b>¥${(cost + gc).toFixed(4)}</b>`;
}

function renderLayers(ls) {
  $("layers").innerHTML = (ls || []).map(l => {
    const pct = Math.min(100, l.buffered / Math.max(l.threshold, 1) * 100);
    const cls = l.buffered >= l.threshold ? "over" : (pct > 60 ? "hot" : "");
    return `<div class="bar"><span class="lbl">${esc(l.layer)}</span>
      <div class="track"><div class="fill ${cls}" style="width:${pct}%"></div></div>
      <span style="color:var(--dim)">${l.buffered}/${l.threshold}</span></div>`;
  }).join("") || "—";
}

async function tick() {
  try {
    if (!tid) await loadTables();
    if (!tid) throw new Error("无表");
    const tree = await jget("/api/t/" + tid + "/tree");
    let maint = null;
    try { maint = await jget("/api/t/" + tid + "/maint"); } catch (e) { }   // 无 /maint 接口：监控区置空
    const root = tree.root;
    const out = [];
    renderTree(root, 0, out, lastTree.root);
    $("tree").innerHTML = out.join("");
    $("poll").textContent = "✔ " + new Date().toLocaleTimeString("zh-CN", { hour12: false }) + " · docCount=" + tree.docCount;
    $("params").textContent = `${tree.backend || "?"} · ${tree.mode} · 落位门控 gate=${tree.noulGate} / 选择门控=${tree.choiceGate}`;
    if (maint) {
      diffMaint(maint);
      renderMaint(maint);
      renderBill(maint.stats, maint);
      renderLayers(maint.layers);
    } else {
      $("phase").textContent = "n/a"; $("phase").className = "phase idle";
      $("current").textContent = ""; $("result").textContent = ""; $("extra").textContent = "";
      $("maintKpi").innerHTML = `<div><b>—</b><span>无维护快照</span></div>`;
      $("billKpi").innerHTML = `<div><b>—</b><span>判定账单见灌入进度</span></div>`;
      $("cost").innerHTML = ""; $("gencost").innerHTML = "";
      $("layers").innerHTML = "—";
    }
    lastTree = tree; lastMaint = maint || {};
  } catch (e) { $("poll").textContent = "✘ " + e.message; }
}

$("tables").onchange = e => { tid = e.target.value; lastTree = {}; lastMaint = {}; renderEv(); tick(); };
$("maintBtn").onclick = async () => {
  if (!tid) return;
  await post("/api/t/" + tid + "/extend", { node: "ROOT" });
  ev("audit", "手动触发 ROOT 拆细 /extend");
  tick();
};

let running = false;
async function delTable(id) { return (await fetch(API + "/api/tables?id=" + encodeURIComponent(id), { method: "DELETE" })).json(); }
async function post(path, body) { return (await fetch(API + path, { method: "POST", body: JSON.stringify(body || {}), headers: { "Content-Type": "text/plain" } })).json(); }

async function waitIdle(ms, note) {
  const t0 = Date.now();
  while (Date.now() - t0 < ms) {
    await tick();
    // phase 值域 idle/running/done/error（MaintStatus）——只要不是 running 都算收工；写 "idle" 会死等到超时
    if (lastMaint.phase && lastMaint.phase !== "running") return;
    $("run").textContent = `${note} 维护中：${lastMaint.current || ""} · ${Math.round((Date.now() - t0) / 1000)}s`;
    await new Promise(r => setTimeout(r, 3000));
  }
  throw new Error(note + " 等待超时");
}

async function startTest() {
  if (running) return; running = true; $("startBtn").disabled = true;
  try {
    Object.keys(localStorage).filter(k => k.startsWith("dulemon-ev-")).forEach(k => localStorage.removeItem(k));
    const ts = await jget("/api/tables");
    const old = (ts.tables || ts || []).find(t => t.name === TBLNAME);
    if (old) { $("run").textContent = "清除旧表 " + old.id + "…"; await delTable(old.id); tid = null; }
    $("run").textContent = "建表…";
    const meta = await post("/api/tables", { name: TBLNAME, mode: "noul", note: "DuLeMon 100 条原子事实模拟记忆" });
    tid = meta.id; lastTree = {}; lastMaint = {}; $("tables").value = tid; renderEv();
    ev("info", "建表 " + tid + "，开始灌入 " + CORPUS.length + " 条");
    const t0 = Date.now();
    for (let i = 0; i < CORPUS.length; i++) {
      const r = await post("/api/t/" + tid + "/add", { content: CORPUS[i], id: "M-" + String(i).padStart(3, "0") });
      if (i % 5 === 4 || i === CORPUS.length - 1) {
        const m = /tokens in ([\d,]+)/.exec(r.stats || "");
        $("run").textContent = `灌入 ${i + 1}/${CORPUS.length} · ${Math.round((Date.now() - t0) / 1000)}s · 决策 in ${m ? m[1] : 0}`;
        tick();
      }
    }
    ev("info", `灌入完成 ${CORPUS.length} 条 · ${Math.round((Date.now() - t0) / 1000)}s`);
    ev("info", `灌入完成 ${CORPUS.length} 条 · ${Math.round((Date.now() - t0) / 1000)}s · 等待拆细收敛…`);
    // add 达水位自动后台拆细：轮询树签名直到连续无变化
    let stable = 0, lastSig = "";
    const t1 = Date.now();
    while (Date.now() - t1 < 600000 && stable < 4) {
      await new Promise(r => setTimeout(r, 3000));
      await tick();
      const sig = (function sg(n) { return [n.name, n.docCount, (n.children || []).map(sg)]; })(((lastTree || {}).root) || { name: "?" });
      const cur = JSON.stringify(sig);
      if (cur === lastSig) stable++; else { stable = 0; lastSig = cur; }
      $("run").textContent = `等待拆细收敛… ${Math.round((Date.now() - t1) / 1000)}s`;
    }
    ev("done", stable >= 4 ? "树连续 4 次无变化 → 拆细收敛，测试结束" : "等待超时（树可能仍在拆）");
    $("run").textContent = "";
  } catch (e) { ev("rw", "出错：" + e.message); $("run").textContent = "✘ " + e.message; }
  running = false; $("startBtn").disabled = false; tick();
}

async function clearAll() {
  if (running) return;
  if (!confirm("删除「" + TBLNAME + "」表与本地全部事件时间线？")) return;
  const ts = await jget("/api/tables");
  const old = (ts.tables || ts || []).find(t => t.name === TBLNAME);
  if (old) await delTable(old.id);
  Object.keys(localStorage).filter(k => k.startsWith("dulemon-ev-")).forEach(k => localStorage.removeItem(k));
  tid = null; lastTree = {}; lastMaint = {};
  await loadTables(); renderEv();
  $("run").textContent = "已清除" + (old ? "（删表 " + old.id + "）" : "（无同名表）");
  tick();
}

$("startBtn").onclick = startTest;
$("clearBtn").onclick = clearAll;

(async () => {
  await loadTables();
  renderEv();
  await tick();
  timer = setInterval(tick, 2500);
})();
</script>
</body>
